<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Save to Savers</title>
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0f0ee; color: #111; }
    main { width: min(360px, calc(100vw - 32px)); padding: 24px; border: 1px solid #ddd; border-radius: 12px; background: #fff; }
    h1 { margin: 0 0 8px; font-size: 16px; }
    p { margin: 0; font-size: 13px; line-height: 1.5; }
    button { margin-top: 16px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; }
    button[hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0f0f; color: #e8e8e6; }
      main, button { background: #161616; border-color: #333; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Savers</h1>
    <p id="status" role="status">Saving to Unsorted…</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var url = params.get("url") || "";
      var title = params.get("title") || "";
      var token = params.get("token") || "";
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");
      var saving = false;

      function report(state, message) {
        status.textContent = message;
        retry.hidden = state !== "error";
        if (window.parent !== window) {
          window.parent.postMessage({ type: "savers-quick-save", state: state, message: message }, "*");
        } else if (state === "saved" && window.opener) {
          window.setTimeout(function () { window.close(); }, 1200);
        }
      }

      async function save() {
        if (saving) return;
        saving = true;
        retry.hidden = true;
        status.textContent = "Saving to Unsorted…";
        try {
          var parsed = new URL(url);
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") throw new Error("This page cannot be saved.");
          var headers = { "Content-Type": "application/json" };
          if (token) headers.Authorization = "Bearer " + token;
          var response = await fetch("/api/bookmarks", {
            method: "POST",
            headers: headers,
            body: JSON.stringify({ url: url, title: title || parsed.hostname, collection_id: null, quick_save: true })
          });
          if (!response.ok) {
            var body = await response.json().catch(function () { return {}; });
            throw new Error(body.error || (response.status === 401 ? "Sign in to Savers, then try again." : "Could not save this page."));
          }
          report("saved", "Saved to Unsorted");
        } catch (error) {
          report("error", error instanceof Error ? error.message : "Could not save this page.");
        } finally {
          saving = false;
        }
      }

      retry.addEventListener("click", save);
      save();
    })();
  </script>
</body>
</html>
