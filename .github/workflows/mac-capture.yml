name: Build Savers Capture

on:
  push:
    paths:
      - 'macos/SaversCapture/**'
      - '.github/workflows/mac-capture.yml'
  pull_request:
    paths:
      - 'macos/SaversCapture/**'
      - '.github/workflows/mac-capture.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./macos/SaversCapture/build-app.sh
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent 'macos/SaversCapture/dist/Savers Capture.app' Savers-Capture-macOS.zip
      - name: Verify download ZIP
        run: |
          unzip -t Savers-Capture-macOS.zip
          mkdir -p /tmp/savers-capture-verify
          ditto -x -k Savers-Capture-macOS.zip /tmp/savers-capture-verify
          test -x '/tmp/savers-capture-verify/Savers Capture.app/Contents/MacOS/SaversCapture'
      - uses: actions/upload-artifact@v4
        with:
          name: Savers-Capture-macOS
          path: Savers-Capture-macOS.zip
      - name: Publish direct preview download
        if: github.ref == 'refs/heads/rebuild'
        run: |
          latest=$(git ls-remote origin refs/heads/rebuild | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer rebuild commit exists; skip publishing this older build."
            exit 0
          fi
          mkdir -p public/downloads
          cp Savers-Capture-macOS.zip public/downloads/savers-capture-macos-0.9.2.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/savers-capture-macos-0.9.2.zip
          git commit -m 'Publish Savers Capture direct download'
          git push origin HEAD:rebuild
      - name: Publish staging download
        if: github.ref == 'refs/heads/rebuild-live'
        run: |
          latest=$(git ls-remote origin refs/heads/rebuild-live | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer staging commit exists; skip publishing this older build."
            exit 0
          fi
          mkdir -p public/downloads
          cp Savers-Capture-macOS.zip public/downloads/savers-capture-macos-0.9.4.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/downloads/savers-capture-macos-0.9.4.zip
          git commit -m 'Publish Savers Capture staging download'
          git push origin HEAD:rebuild-live
